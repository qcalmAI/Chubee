model_list:
  - model_name: primary_model
    litellm_params:
      model: openai/nemotron-3-super
      api_base: http://vllm-super:8000/v1
      api_key: fake
      max_tokens: 32768
  - model_name: primary_model_fast
    litellm_params:
      model: openai/nemotron-3-super
      api_base: http://vllm-super:8000/v1
      api_key: fake
      max_tokens: 8192
  - model_name: voice_model
    litellm_params:
      model: openai/nemotron-3-super
      api_base: http://vllm-super:8000/v1
      api_key: fake
      max_tokens: 2048
  - model_name: vision_model
    litellm_params:
      model: ollama/glm4v-flash
      api_base: http://host.docker.internal:11434
      max_tokens: 4096
  - model_name: embedding_model
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434
  - model_name: frontier_model
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/FRONTIER_API_KEY
      max_tokens: 32768
  - model_name: coding_model
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/FRONTIER_API_KEY
      max_tokens: 32768
litellm_settings:
  callbacks:
    - langfuse
    - chubee_budget.chubee_budget_instance
    - chubee_compressor.chubee_compressor_instance
    - chubee_router.chubee_router_instance
  request_timeout: 600
  num_retries: 2
  fallbacks:
    - primary_model:
        - frontier_model
    - primary_model_fast:
        - frontier_model
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
