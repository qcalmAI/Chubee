services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /mnt/chubee-data/docker-volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=1GB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=4GB
      -c work_mem=64MB

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - /mnt/chubee-data/docker-volumes/qdrant:/qdrant/storage

  vllm-super:
    image: vllm-node:${VLLM_IMAGE_TAG}
    container_name: vllm-super
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /mnt/chubee-data/super-weights:/weights:ro
      - /mnt/chubee-data/docker-volumes/vllm-hf-cache:/hf-cache
      - ~/chubee/stack/litellm/super_v3_reasoning_parser.py:/app/super_v3_reasoning_parser.py:ro
    environment:
      - HF_HOME=/hf-cache
      - VLLM_NVFP4_GEMM_BACKEND=marlin
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_FLASHINFER_ALLREDUCE_BACKEND=trtllm
    command: >
      vllm serve /weights/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
      --served-model-name nemotron-3-super
      --trust-remote-code
      --async-scheduling
      --enforce-eager
      --dtype auto
      --max-model-len ${VLLM_MAX_MODEL_LEN}
      --kv-cache-dtype fp8
      --gpu-memory-utilization ${VLLM_GPU_MEM_UTIL}
      --enable-chunked-prefill
      --mamba-ssm-cache-dtype float16
      --reasoning-parser-plugin /app/super_v3_reasoning_parser.py
      --reasoning-parser super_v3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 2400s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_HOST=ChubeeAcer
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/New_York
      - N8N_LOG_LEVEL=warn
      - HA_TOKEN=${HA_TOKEN}
      - CHUBEE_MCP_TOKEN=${CHUBEE_MCP_TOKEN}
    volumes:
      - /mnt/chubee-data/docker-volumes/n8n:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_OLLAMA_API=false
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - RAG_EMBEDDING_MODEL=bge-m3
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://host.docker.internal:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=dummy
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=af_heart
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY}
    volumes:
      - /mnt/chubee-data/docker-volumes/open-webui:/app/backend/data
    depends_on:
      litellm:
        condition: service_started
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8484:8080"
    volumes:
      - /mnt/chubee-data/docker-volumes/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://ChubeeAcer:8484/
      - SEARXNG_SECRET=${SEARXNG_SECRET}

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    volumes:
      - /mnt/chubee-data/docker-volumes/crawl4ai:/root/.crawl4ai
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
      - INSTALL_TYPE=full
    shm_size: 1gb

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/chubee-data/docker-volumes/portainer:/data

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /mnt/chubee-data/docker-volumes/stirling-pdf/tessdata:/usr/share/tessdata
      - /mnt/chubee-data/docker-volumes/stirling-pdf/configs:/configs
    environment:
      - DOCKER_ENABLE_SECURITY=false

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - FRONTIER_API_KEY=${FRONTIER_API_KEY}
      - FRONTIER_MODEL=${FRONTIER_MODEL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_HOST=http://langfuse:3000
      - CONTEXT_THRESHOLD=${CONTEXT_THRESHOLD}
    volumes:
      - ./litellm/litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      langfuse:
        condition: service_started
      vllm-super:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://ChubeeAcer:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
      - SALT=${LANGFUSE_SALT}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}
      - LANGFUSE_INIT_ORG_NAME=Chubee
      - LANGFUSE_INIT_ORG_ID=chubee-org
      - LANGFUSE_INIT_PROJECT_NAME=Chubee
      - LANGFUSE_INIT_PROJECT_ID=chubee-proj
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_INIT_USER_EMAIL=qcalmus@gmail.com
      - LANGFUSE_INIT_USER_NAME=Quinton
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
