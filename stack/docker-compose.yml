services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
    - 6333:6333
    volumes:
    - /mnt/chubee-data/docker-volumes/qdrant:/qdrant/storage
  vllm-super:
    image: vllm-node:${VLLM_IMAGE_TAG}
    container_name: vllm-super
    restart: unless-stopped
    ports:
    - 8000:8000
    volumes:
    - /mnt/chubee-data/super-weights:/weights:rw
    - /mnt/chubee-data/docker-volumes/vllm-hf-cache:/hf-cache
    environment:
    - HF_HOME=/hf-cache
    - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    - VLLM_FLASHINFER_ALLREDUCE_BACKEND=trtllm
    - VLLM_USE_FLASHINFER_MOE_FP8=1
    - VLLM_FLASHINFER_MOE_BACKEND=throughput
    command:
    - vllm
    - serve
    - nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    - --served-model-name
    - nemotron-nano-30b
    - local/nemotron-nano-30b
    - --trust-remote-code
    - --max-model-len
    - "262144"
    - --tensor-parallel-size
    - "1"
    - --kv-cache-dtype
    - fp8
    - --gpu-memory-utilization
    - "${VLLM_GPU_MEM_UTIL:-0.75}"
    - --enable-chunked-prefill
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    - --reasoning-parser-plugin
    - /weights/nano_v3_reasoning_parser.py
    - --reasoning-parser
    - nano_v3
    - --port
    - "8000"
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:8000/health || exit 1
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 2400s
    extra_hosts:
    - host.docker.internal:host-gateway

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
    - 8484:8080
    volumes:
    - /mnt/chubee-data/docker-volumes/searxng:/etc/searxng
    environment:
    - SEARXNG_BASE_URL=http://ChubeeAcer:8484/
    - SEARXNG_SECRET=${SEARXNG_SECRET}
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    ports:
    - 11235:11235
    volumes:
    - /mnt/chubee-data/docker-volumes/crawl4ai:/root/.crawl4ai
    # Memory guard raised to 99.5% (default 95%): the GB10's unified memory sits ~97%
    # because vLLM reserves 0.85 of the pool; without this, crawl4ai refuses every crawl.
    - /mnt/chubee-data/docker-volumes/crawl4ai-config/config.yml:/app/config.yml:ro
    environment:
    - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
    - INSTALL_TYPE=full
    shm_size: 1gb
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
    - 9000:9000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /mnt/chubee-data/docker-volumes/portainer:/data
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
    - 8888:8080
    volumes:
    - /mnt/chubee-data/docker-volumes/stirling-pdf/tessdata:/usr/share/tessdata
    - /mnt/chubee-data/docker-volumes/stirling-pdf/configs:/configs
    environment:
    - DOCKER_ENABLE_SECURITY=false
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    ports:
    - 8123:8123
    volumes:
    - /mnt/chubee-data/docker-volumes/homeassistant:/config
    environment:
    - TZ=America/New_York
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - dialout
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://127.0.0.1:8123/ -O /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper
    restart: unless-stopped
    ports:
    - 10300:10300
    volumes:
    - /mnt/chubee-data/docker-volumes/wyoming-whisper:/data
    command: --model tiny-int8 --uri tcp://0.0.0.0:10300 --data-dir /data --device cpu --compute-type int8
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/10300'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    restart: unless-stopped
    ports:
    - 10400:10400
    volumes:
    - /mnt/chubee-data/docker-volumes/wyoming-openwakeword:/data
    command: --uri tcp://0.0.0.0:10400
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/10400'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
    - 10500:10500
    volumes:
    - /mnt/chubee-data/docker-volumes/piper-tts:/data
    command: --voice en_US-lessac-medium --uri tcp://0.0.0.0:10500 --data-dir /data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/10500'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: kiwix
    restart: unless-stopped
    ports:
    - 8180:8080
    volumes:
    - /mnt/chubee-data/corpora:/data
    command: ["--library", "/data/library.xml", "--customIndex", "/data/welcome.html"]
    environment:
    - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://127.0.0.1:8080 -O /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  kiwix-nginx:
    image: nginx:alpine
    container_name: kiwix-nginx
    restart: unless-stopped
    ports:
    - 8181:8080
    volumes:
    - /mnt/chubee-data/corpora/kiwix-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kiwix:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://127.0.0.1:8080 -O /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
    - 8182:80
    volumes:
    - /mnt/chubee-data/corpora:/srv
    - /mnt/chubee-data/docker-volumes/filebrowser:/database
    command: --address=0.0.0.0 --port=80 --root=/srv --database=/database/filebrowser.db
    healthcheck:
      test: ["CMD-SHELL", "wget -q http://localhost:80 -O /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  hermes:
    image: nousresearch/hermes-agent@sha256:9c0090147b7585afbe2d38f685100c0afaddcbb58b0a8798fd41a384d93fe785
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
    - /home/qcalmus/.hermes:/opt/data
    environment:
    - HERMES_DASHBOARD=1
    - HERMES_DASHBOARD_INSECURE=1
    - API_SERVER_ENABLED=true
    - API_SERVER_HOST=0.0.0.0
    - API_SERVER_KEY=hermes-local
    - PUID=1000
    - PGID=1000
    networks:
    - default
    ports:
    - 8642:8642
    - 9119:9119
